<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>Voice</title>
    <meta
      name="description"
      content="Instant voice calls, no account needed. Open-source and private."
    />

    <!-- telegram / discord: compact card. title matches site_name so telegram can collapse the duplicate -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Voice" />
    <meta property="og:title" content="Voice" />
    <meta
      property="og:description"
      content="Instant voice calls, no account needed.&#10;Open-source and private."
    />
    <meta property="og:url" content="https://voice.k.vu/" />
    <meta property="og:image" content="https://voice.k.vu/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Voice" />
    <meta name="twitter:card" content="summary" />

    <!-- prevent flash of wrong theme -->
    <script>
      (function () {
        const savedTheme = localStorage.getItem('theme-mode');
        let resolvedTheme = 'light';

        if (savedTheme === 'light' || savedTheme === 'dark') {
          resolvedTheme = savedTheme;
        } else if (savedTheme === 'system' || !savedTheme) {
          resolvedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }

        document.documentElement.setAttribute('data-theme', resolvedTheme);
      })();
    </script>

    <style>
      /* critical styles for smooth loading */
      html {
        background: #f8fafcf2;
      }

      html[data-theme='dark'] {
        background: rgb(15, 23, 42);
      }

      #app-loader {
        position: fixed;
        top: calc(25vh + 71.5px);
        /* center in top half, accounting for header space */
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
      }

      .loader-spinner {
        box-sizing: border-box;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(71, 85, 105, 0.2);
        border-top-color: #475569;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      [data-theme='dark'] .loader-spinner {
        border-color: rgba(148, 163, 184, 0.2);
        border-top-color: #94a3b8;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* fade out animation for loader */
      #app-loader.fade-out {
        opacity: 0;
        transition: opacity 0.2s ease-out;
      }

      /* hide root until ready */
      #root {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }

      #root.loaded {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div id="app-loader">
      <div class="loader-spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
